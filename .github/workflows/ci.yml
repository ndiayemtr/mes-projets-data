name: CI Smart City Projects

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Indique à GitHub de chercher par défaut dans votre sous-dossier d'API
    defaults:
      run:
        working-directory: api/smart_city

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest -v
